name: Uzbūvēt APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  firebase:
    name: Firebase pārbaude
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalēt Firebase
        run: npm install firebase@^11 --no-save
      - name: Kontu izveide (Email/Password)
        run: node scripts/smoke.mjs auth
      - name: Datubāze un noteikumi
        run: node scripts/smoke.mjs firestore
      - name: Notīrīt testa kontu
        if: always()
        run: node scripts/smoke.mjs cleanup || true

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - name: Instalēt atkarības
        run: npm install

      - name: Sagatavot lietotnes failus
        env:
          APP_VERSION: 1.0.${{ github.run_number }}
        run: |
          node scripts/build-www.mjs
          npx esbuild src/cloud.js --bundle --format=iife --minify --target=es2019 --outfile=www/cloud.js
          ls -la www

      - name: Izveidot Android projektu
        run: npx cap add android

      - name: Iemetēja Android kods (bloķēšanas ekrāns, skaļuma pogas)
        run: |
          DIR=android/app/src/main/java/lv/iemetejs/app
          ls $DIR
          cp native-android/MainActivity.java native-android/IemetejsPlugin.java $DIR/
          M=android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.VIBRATE" $M || sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.VIBRATE" />|' $M
          grep -n "permission" $M

      - name: Ikona un sākuma ekrāns
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor "#0e6a3d" --iconBackgroundColorDark "#0e6a3d" --splashBackgroundColor "#0e6a3d" --splashBackgroundColorDark "#0a1811"

      - name: Sinhronizēt
        run: npx cap sync android

      - name: Versijas numurs
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Parakstīšanas atslēga (vienmēr tā pati, lai atjauninājumi uzstādās pāri)
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android.signingConfigs.create("iemetejs") {
              storeFile file("${rootDir}/../signing/debug.keystore")
              storePassword "android"
              keyAlias "androiddebugkey"
              keyPassword "android"
          }
          android.buildTypes.debug.signingConfig android.signingConfigs.iemetejs
          GRADLE
          tail -9 android/app/build.gradle

      - name: Uzbūvēt APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Pārsaukt APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "Iemetejs-1.0.${{ github.run_number }}.apk"

      - name: Pārbaudīt parakstu
        run: |
          WANT=$(keytool -list -v -keystore signing/debug.keystore -storepass android | grep "SHA256:" | head -1 | awk '{print $2}')
          GOT=$(keytool -printcert -jarfile "Iemetejs-1.0.${{ github.run_number }}.apk" | grep "SHA256:" | head -1 | awk '{print $2}')
          echo "gaidīts: $WANT"; echo "iegūts:  $GOT"
          test "$WANT" = "$GOT"

      - uses: actions/upload-artifact@v4
        with:
          name: Iemetejs-1.0.${{ github.run_number }}
          path: Iemetejs-*.apk

      - name: Publicēt laidienu
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" Iemetejs-*.apk \
            --title "Iemetējs 1.0.${{ github.run_number }}" \
            --notes "Lejupielādē APK failu zemāk un uzstādi telefonā. Uzstādot pāri vecajai versijai, dati saglabājas."
