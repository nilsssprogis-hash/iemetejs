name: Uzbūvēt APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  firebase:
    name: Firebase pārbaude
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalēt Firebase
        run: npm install firebase@^11 --no-save
      - name: Kontu izveide (Email/Password)
        run: node scripts/smoke.mjs auth
      - name: Datubāze un noteikumi
        run: node scripts/smoke.mjs firestore
      - name: Notīrīt testa kontu
        if: always()
        run: node scripts/smoke.mjs cleanup || true

  push-worker:
    name: Paziņojumu serveris (Cloudflare)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Uzstādīt serveri
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$FIREBASE_SA" ]; then
            echo "Cloudflare vai Firebase atslēgas nav iestatītas — izlaižu."; exit 0; fi
          npx --yes wrangler@3 deploy push-worker/worker.js --name iemetejs-push --compatibility-date 2024-09-23
          printf '%s' "$FIREBASE_SA" | npx --yes wrangler@3 secret put FIREBASE_SA --name iemetejs-push
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | python3 -c "import json,sys;print(json.load(sys.stdin)['result']['subdomain'])")
          URL="https://iemetejs-push.$SUB.workers.dev"
          echo "Serveris: $URL"
          for i in $(seq 1 20); do
            if curl -sf "$URL/health"; then echo; break; fi
            echo "gaidu sertifikātu ($i)..."; sleep 15
          done
          curl -sf "$URL/health"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL/notify" -H "content-type: application/json" -d '{"roundId":"x"}')
          echo "bez atļaujas: $CODE"; test "$CODE" = "401"

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - name: Instalēt atkarības
        run: npm install

      - name: Paziņojumu adrese
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -f android-config/google-services.json ]; then
            SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | python3 -c "import json,sys;d=json.load(sys.stdin);print((d.get('result') or {}).get('subdomain') or '')")
            if [ -n "$SUB" ]; then
              echo "PUSH_URL=https://iemetejs-push.$SUB.workers.dev" >> $GITHUB_ENV
              echo "PUSH_ENABLED=1" >> $GITHUB_ENV
              echo "Paziņojumi ieslēgti: https://iemetejs-push.$SUB.workers.dev"
            fi
          else echo "Paziņojumi izslēgti (nav google-services.json vai Cloudflare atslēgu)"; fi

      - name: Sagatavot lietotnes failus
        env:
          APP_VERSION: 1.0.${{ github.run_number }}
        run: |
          node scripts/build-www.mjs
          npx esbuild src/cloud.js --bundle --format=iife --minify --target=es2019 --outfile=www/cloud.js
          ls -la www

      - name: Izveidot Android projektu
        run: npx cap add android

      - name: Iemetēja Android kods (bloķēšanas ekrāns, skaļuma pogas)
        run: |
          DIR=android/app/src/main/java/lv/iemetejs/app
          ls $DIR
          cp native-android/MainActivity.java native-android/IemetejsPlugin.java $DIR/
          M=android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.VIBRATE" $M || sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.VIBRATE" />|' $M
          grep -n "permission" $M

      - name: Ikona un sākuma ekrāns
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor "#0e6a3d" --iconBackgroundColorDark "#0e6a3d" --splashBackgroundColor "#0e6a3d" --splashBackgroundColorDark "#0a1811"

      - name: Firebase Android konfigurācija (paziņojumiem)
        run: |
          if [ -f android-config/google-services.json ]; then cp android-config/google-services.json android/app/; echo "google-services.json pievienots"; fi

      - name: Sinhronizēt
        run: npx cap sync android

      - name: Versijas numurs
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Parakstīšanas atslēga (vienmēr tā pati, lai atjauninājumi uzstādās pāri)
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android.signingConfigs.create("iemetejs") {
              storeFile file("${rootDir}/../signing/debug.keystore")
              storePassword "android"
              keyAlias "androiddebugkey"
              keyPassword "android"
          }
          android.buildTypes.debug.signingConfig android.signingConfigs.iemetejs
          GRADLE
          tail -9 android/app/build.gradle

      - name: Uzbūvēt APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Pārsaukt APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "Iemetejs-1.0.${{ github.run_number }}.apk"

      - name: Pārbaudīt parakstu
        run: |
          WANT=$(keytool -list -v -keystore signing/debug.keystore -storepass android | grep "SHA256:" | head -1 | awk '{print $2}')
          GOT=$(keytool -printcert -jarfile "Iemetejs-1.0.${{ github.run_number }}.apk" | grep "SHA256:" | head -1 | awk '{print $2}')
          echo "gaidīts: $WANT"; echo "iegūts:  $GOT"
          test "$WANT" = "$GOT"

      - uses: actions/upload-artifact@v4
        with:
          name: Iemetejs-1.0.${{ github.run_number }}
          path: Iemetejs-*.apk

      - name: Publicēt laidienu
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" Iemetejs-*.apk \
            --title "Iemetējs 1.0.${{ github.run_number }}" \
            --notes "Lejupielādē APK failu zemāk un uzstādi telefonā. Uzstādot pāri vecajai versijai, dati saglabājas."
